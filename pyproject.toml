
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logvigil"
version = "1.0.0"
description = "Local defensive SOC log analyzer"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Muhammad Mehdi" }]
maintainers = [{ email = "muhammad.mehdi@aol.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
logvigil = "soc_assistant.main:main"

[tool.setuptools.package-data]
soc_assistant = ["knowledge/*.json"]
